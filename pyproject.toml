[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm[toml]>=7.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/gulp_dissect/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[project]
name = "gulp-dissect"
dynamic = ["version"]
description = "Extract records from forensic disk images with Dissect and ingest into gULP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["gulp-sdk", "dissect==3.22", "python-dateutil", "tqdm", "mentat-gulp>=1.7.201"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
gulp-dissect = "gulp_dissect.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests requiring a live gULP server and sample data"]
