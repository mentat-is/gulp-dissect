[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gulp-dissect"
version = "0.1.0"
description = "Extract records from forensic disk images with Dissect and ingest into gULP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["gulp-sdk", "dissect", "python-dateutil", "tqdm", "mentat-gulp"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
gulp-dissect = "gulp_dissect.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests requiring a live gULP server and sample data"]
